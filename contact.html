<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Exploración Espacial</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; background-color: #0b1026; color: white;">

    <nav style="background-color: #151b3d; padding: 15px; text-align: center;">
        <a href="index.html" style="color: #64b5f6; margin: 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: #64b5f6; margin: 15px; text-decoration: none;">Sobre el tema</a>
        <a href="contact.html" style="color: #64b5f6; margin: 15px; text-decoration: none;">Contacto</a>
    </nav>

    <main style="max-width: 600px; margin: 50px auto; padding: 20px;">
        <h1 style="color: #90caf9; text-align: center;">Contacto</h1>

        <p style="text-align: center; line-height: 1.6;">
            ¿Tienes alguna pregunta sobre la exploración espacial?
            Envíanos un mensaje.
        </p>

        <form style="background-color: #171d46; padding: 25px; border-radius: 10px;">
            <label for="nombre" style="display: block; margin-bottom: 8px;">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
                   style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">

            <label for="email" style="display: block; margin-bottom: 8px;">Correo electrónico:</label>
            <input type="email" id="email" name="email"
                   style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;">

            <label for="mensaje" style="display: block; margin-bottom: 8px;">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="5"
                      style="width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box;"></textarea>

            <button type="submit"
                    style="background-color: #42a5f5; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer;">
                Enviar mensaje
            </button>
        </form>
    </main>

</body>
</html>
